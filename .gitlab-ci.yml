stages:
  - build
  - deploy
  - notify

variables:
  BE_IMAGE: be-app:$CI_COMMIT_SHORT_SHA
  CONTAINER_NAME: be-app

build:
  stage: build
  script:
    - docker build -t $BE_IMAGE .
  only:
    - release
  tags:
    - macbook

deploy:
  stage: deploy
  needs: [build]
  script:
    - docker stop $CONTAINER_NAME || true
    - docker rm $CONTAINER_NAME || true
    - docker run -d
        --name $CONTAINER_NAME
        -p 8599:8080
        --restart unless-stopped
        -e SPRING_DATASOURCE_URL=$SPRING_DATASOURCE_URL
        -e SPRING_DATASOURCE_USERNAME=$SPRING_DATASOURCE_USERNAME
        -e SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD
        -e SPRING_DATA_REDIS_HOST=$SPRING_DATA_REDIS_HOST
        -e SPRING_DATA_REDIS_PORT=$SPRING_DATA_REDIS_PORT
        -e SPRING_DATA_REDIS_PASSWORD=$SPRING_DATA_REDIS_PASSWORD
        -e SPRING_MAIL_HOST=$SPRING_MAIL_HOST
        -e SPRING_MAIL_PORT=$SPRING_MAIL_PORT
        -e SPRING_MAIL_USERNAME=$SPRING_MAIL_USERNAME
        -e SPRING_MAIL_PASSWORD=$SPRING_MAIL_PASSWORD
        -e SPRING_MAIL_FROM=$SPRING_MAIL_FROM
        -e SPRING_JPA_HIBERNATE_DDL_AUTO=$SPRING_JPA_HIBERNATE_DDL_AUTO
        -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
        -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
        -e SERVER_ADDRESS=0.0.0.0
        -e SPRING_WEB_CORS_ALLOWED_ORIGINS=http://localhost:4599
        $BE_IMAGE
    - docker images be-app --format "{{.Tag}}" | grep -v $CI_COMMIT_SHORT_SHA | xargs -I {} docker rmi be-app:{} || true
  only:
    - release
  tags:
    - macbook

notify-success:
  stage: notify
  needs: [deploy]
  script:
    - |
      curl -X POST $SLACK_WEBHOOK_URL \
      -H 'Content-type: application/json' \
      --data "{
        \"text\": \"✅ *BE Deploy Successful*\n- Branch: $CI_COMMIT_REF_NAME\n- Commit: $CI_COMMIT_SHORT_SHA\n- By: $CI_COMMIT_AUTHOR\n- URL: http://localhost:8599\"
      }"
  only:
    - release
  tags:
    - macbook
  when: on_success

notify-failure:
  stage: notify
  script:
    - |
      curl -X POST $SLACK_WEBHOOK_URL \
      -H 'Content-type: application/json' \
      --data "{
        \"text\": \"❌ *BE Deploy failed*\n- Branch: $CI_COMMIT_REF_NAME\n- Commit: $CI_COMMIT_SHORT_SHA\n- By: $CI_COMMIT_AUTHOR\n- Pipeline: $CI_PIPELINE_URL\"
      }"
  only:
    - release
  tags:
    - macbook
  when: on_failure
